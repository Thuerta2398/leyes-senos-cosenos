<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ley de Cosenos · Autoestudio · Matemáticas V</title>
<style>:root{
  --navy:#1B2A41; --dk2:#34495E; --bg2:#F1F4F8; --line:#D6DEE8;
  --blue:#3B82C4; --teal:#2A9D8F; --coral:#E76F51; --green:#2E8B57; --red:#C0392B; --orange:#F4A261;
  --green-t:#E6F4EC; --orange-t:#FDF0E4; --red-t:#FBE9E7; --gray:#8795A6;
  --serif: Cambria, "Cambria Math", Georgia, "Times New Roman", serif;
  --sans: Calibri, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--navy);font-family:var(--sans);font-size:17px;line-height:1.45}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.c-a{color:var(--blue)} .c-b{color:var(--teal)} .c-c{color:var(--coral)} .c-g{color:var(--gray)}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 18px}
.top-row{display:flex;align-items:center;gap:14px;max-width:1040px;margin:0 auto}
.top-row h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kicker{color:var(--orange);font-size:11px;letter-spacing:2px;font-weight:700}
.btn-calc{background:var(--orange);color:var(--navy);border:0;border-radius:999px;padding:8px 16px;font-weight:700;display:flex;gap:8px;align-items:center}
nav.prog{max-width:1040px;margin:10px auto 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav.prog button{min-width:34px;height:34px;border-radius:999px;border:2px solid #4A5D78;background:transparent;color:#C9D3E0;font-weight:700;font-size:13px;padding:0 6px}
nav.prog button.cur{background:#fff;color:var(--navy);border-color:#fff}
nav.prog button.done{background:var(--green);border-color:var(--green);color:#fff}
nav.prog button.help{background:var(--orange);border-color:var(--orange);color:var(--navy)}
nav.prog button.cur.done,nav.prog button.cur.help{box-shadow:0 0 0 3px #fff}
nav.prog button:disabled{opacity:.4;cursor:not-allowed}
nav.prog .sep{flex:0 0 8px;height:2px;background:#4A5D78}
.bar{max-width:1040px;margin:8px auto 0;height:6px;background:#2C3E57;border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));width:0;transition:width .5s}
main{max-width:1040px;margin:0 auto;padding:22px 18px 120px}
h2.st{font-family:var(--serif);font-size:30px;margin:4px 0 6px}
.lead{color:var(--dk2);margin:0 0 18px;font-size:17px;max-width:70ch}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
.sticky-fig{position:sticky;top:150px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}h2.st{font-size:25px}.sticky-fig{position:static}}
.card{background:var(--bg2);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card.ok{background:var(--green-t)} .card.warn{background:var(--orange-t)} .card.bad{background:var(--red-t)}
.card.now{background:#fff;border:2px solid var(--navy)}
.card h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:10px}
.num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.card.ok .num{background:var(--green)}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.fig svg{width:100%;height:auto;display:block}
.story{font-size:17px}
.eqs{font-family:var(--serif);font-size:19px}
.eqbig{font-family:var(--serif);font-size:22px;background:#fff;border-radius:10px;padding:10px 14px;border:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--navy);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.or{background:var(--orange);color:var(--navy)}
.btn.gr{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.choice{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:17px;min-width:120px;text-align:left}
.choice:hover{border-color:var(--blue)}
.choice.right{border-color:var(--green);background:var(--green-t);color:var(--green)}
.choice.wrong{border-color:var(--red);background:var(--red-t);color:var(--red);animation:shake .35s}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid currentColor;background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-family:var(--serif);font-size:17px}
.seg button.on{color:#fff!important}
.seg button.on.c-a{background:var(--blue)} .seg button.on.c-b{background:var(--teal)} .seg button.on.c-c{background:var(--coral)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.fb{margin-top:10px;font-weight:600;min-height:1.2em}
.fb.ok{color:var(--green)} .fb.bad{color:var(--red)} .fb.info{color:var(--dk2)}
.formula{font-family:var(--serif);font-size:20px;line-height:2.4;background:#fff;border-radius:10px;padding:8px 12px;border:1px solid var(--line)}
.slot{display:inline-flex;min-width:54px;height:38px;border:2px dashed var(--gray);border-radius:8px;vertical-align:middle;align-items:center;justify-content:center;padding:0 8px;margin:0 2px;background:#FAFBFD;font-weight:700;cursor:pointer}
.slot.hover,.slot.sel-target{border-color:var(--orange);background:var(--orange-t)}
.slot.filled{border-style:solid;background:#fff}
.slot.right{border-color:var(--green);background:var(--green-t)}
.slot.wrong{border-color:var(--red);background:var(--red-t);animation:shake .35s}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.chip{font-family:var(--serif);font-weight:700;font-size:18px;padding:8px 14px;border-radius:999px;background:#fff;border:2px solid currentColor;touch-action:none;user-select:none;cursor:grab}
.chip.sel{box-shadow:0 0 0 4px var(--orange)}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.ans{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;max-width:460px}
.ans label{font-family:var(--serif);font-weight:700;font-size:18px}
.ans input{font-size:18px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;width:100%;font-family:var(--serif)}
.ans input:focus{outline:none;border-color:var(--blue)}
.ans input.right{border-color:var(--green);background:var(--green-t)}
.ans input.wrong{border-color:var(--red);background:var(--red-t)}
.hint{background:#fff;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:16px}
.hint b{color:#9A4A12}
.ex{font-size:14px;color:var(--dk2);margin:6px 0 10px}
.tri-hit{cursor:pointer}
.tri-hit:hover{opacity:.85}
.q{font-size:19px;font-weight:700}
/* exploración */
#exsvg{touch-action:none;user-select:none}
.handle{cursor:grab}
.handle:active{cursor:grabbing}
.tasks{list-style:none;padding:0;margin:0}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.tasks li:last-child{border-bottom:0}
.tasks .box{flex:0 0 24px;height:24px;border-radius:6px;border:2px solid var(--gray);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.tasks li.ok .box{background:var(--green);border-color:var(--green)}
.tasks li.ok .why{display:block}
.tasks .why{display:none;font-size:14px;color:var(--green);font-weight:600}
.meter{margin-top:10px;font-size:14px;color:var(--dk2)}
.meter .trk{height:14px;background:#E3E9F0;border-radius:7px;margin:3px 0 8px;overflow:hidden}
.meter .trk>div{height:100%;border-radius:7px;transition:width .12s}
/* ejemplo */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700}
.tabs button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.tabs button.fin::after{content:" ✔";color:var(--green)}
.tabs button.on.fin::after{color:#9BE3B8}
.past{background:var(--bg2);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:15px;color:var(--dk2)}
.past b{color:var(--navy)}
.calcline{font-family:"Courier New",monospace;background:var(--navy);color:#fff;border-radius:8px;padding:6px 10px;display:inline-block;margin-top:6px;font-size:15px}
.toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);background:var(--green);color:#fff;padding:14px 26px;border-radius:999px;font-weight:700;font-size:19px;z-index:60;animation:pop .4s;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#calc{position:fixed;right:18px;bottom:18px;width:300px;background:var(--navy);border-radius:16px;padding:10px;z-index:50;box-shadow:0 14px 40px rgba(0,0,0,.35);display:none;touch-action:none}
#calc.open{display:block;animation:pop .25s}
#calc .hd{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;padding:2px 4px 8px;cursor:move}
#calc .hd span.deg{background:var(--orange);color:var(--navy);border-radius:6px;padding:1px 6px;font-size:12px;margin-left:6px}
#calc .hd button{background:transparent;border:0;color:#fff;font-size:20px}
#calc .scr{background:#F4F7FB;border-radius:10px;padding:8px 10px;text-align:right;font-family:var(--serif);min-height:64px}
#calc .scr .ex{font-size:15px;color:var(--dk2);margin:0;word-break:break-all;min-height:20px}
#calc .scr .res{font-size:24px;font-weight:700;color:var(--navy);word-break:break-all}
#calc .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
#calc .keys button{border:0;border-radius:8px;padding:9px 0;background:#2C3E57;color:#fff;font-size:15px;font-weight:600}
#calc .keys button.fn{background:#3E5574}
#calc .keys button.op{background:#4A6587}
#calc .keys button.eq{background:var(--orange);color:var(--navy)}
#calc .keys button.cl{background:var(--red)}
#calc .use{margin-top:8px;width:100%;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px;font-weight:700}
#calc .hd .min{font-size:22px;line-height:1;padding:0 6px}
#calc .hd .tgt{background:var(--teal);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;margin-left:6px;display:none}
#calc .hd .tgt.on{display:inline-block}
input.answer.flash{animation:flashIn .9s}
@keyframes flashIn{0%{background:#FFE7C2}100%{background:#fff}}
#calcFab{position:fixed;left:18px;bottom:78px;width:56px;height:56px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:26px;z-index:49;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;animation:pop .25s;touch-action:manipulation}
#calcFab:hover,#calcFab:focus-visible{background:#2C3E57;outline:3px solid var(--orange);outline-offset:2px}
#calcFab .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--orange);color:var(--navy);font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center}
#calcFab.has .dot{display:flex}
#calcFab[hidden]{display:none}
body.calc-open main{padding-bottom:440px}
.form{max-width:520px}
.form label{display:block;font-weight:700;margin:12px 0 4px}
.form input{width:100%;font-size:17px;padding:10px;border:2px solid var(--line);border-radius:10px}
#cert{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:26px 30px;max-width:760px}
#cert h3{font-family:var(--serif);font-size:24px;margin:0}
#cert table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
#cert th,#cert td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
#cert th{background:var(--bg2)}
.code{font-family:"Courier New",monospace;font-size:22px;font-weight:700;letter-spacing:3px;background:var(--bg2);padding:6px 12px;border-radius:8px;display:inline-block}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.badge{min-width:44px;height:44px;border-radius:22px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:#C9D3E0}
.badge.done{background:var(--green)} .badge.help{background:var(--orange);color:var(--navy)}
footer.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px;z-index:15}
footer.bottom .row{max-width:1040px;margin:0 auto;justify-content:space-between}
@media print{
  header.top,footer.bottom,#calc,#calcFab,.noprint,nav{display:none!important}
  main{padding:0} #cert{border:2px solid #000} body{font-size:13px}
}
@media (max-width:600px){
  header.top{padding:8px 10px}
  .top-row .kicker{display:none}
  .top-row h1{font-size:16px}
  .btn-calc{padding:6px 12px;font-size:15px}
  .btn-calc .lbl{display:none}
  nav.prog{gap:3px;margin-top:6px}
  nav.prog button{min-width:26px;height:26px;font-size:11px;border-width:1.5px;padding:0 4px}
  nav.prog .sep{flex-basis:3px}
  main{padding:14px 12px 110px}
  #calc{right:8px;left:8px;width:auto;bottom:70px}
  #calcFab{left:10px;bottom:72px;width:50px;height:50px;font-size:23px}
  #calc .keys{gap:5px} #calc .keys button{padding:7px 0} #calc .scr{min-height:54px} #calc .scr .res{font-size:21px}
  .formula{font-size:17px}
  .slot{min-width:46px;height:34px}
  .eqbig{font-size:18px}
  footer.bottom .btn{padding:8px 12px}
  #where{font-size:12px!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top">
  <div class="top-row">
    <div style="flex:1;min-width:0"><div class="kicker">MATEMÁTICAS V · AUTOESTUDIO</div><h1>Ley de Cosenos</h1></div>
    <button class="btn-calc" id="calcBtn" aria-label="Abrir calculadora">🧮 <span class="lbl">Calculadora</span></button>
  </div>
  <nav class="prog" id="nav" aria-label="Estaciones"></nav>
  <div class="bar"><div id="barfill"></div></div>
</header>
<main id="main"></main>
<footer class="bottom"><div class="row">
  <button class="btn sec" id="prev">← Anterior</button>
  <span id="where" style="color:#34495E;font-size:15px"></span>
  <button class="btn" id="next">Siguiente →</button>
</div></footer>
<div id="calc" role="dialog" aria-label="Calculadora">
  <div class="hd"><div>Calculadora <span class="deg">DEG</span><span class="tgt" aria-live="polite"></span></div><button class="min" aria-label="Minimizar calculadora" title="Minimizar">–</button></div>
  <div class="scr"><p class="ex"></p><div class="res">0</div></div>
  <div class="keys"></div>
  <button class="use">Usar resultado en la casilla</button>
</div>
<button id="calcFab" aria-label="Abrir calculadora" title="Calculadora">🧮<span class="dot" aria-hidden="true">✓</span></button>
<script>
/* ===== Utilidades y generador determinista por alumno ===== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const sinD = (d) => Math.sin(d * D2R), cosD = (d) => Math.cos(d * D2R), tanD = (d) => Math.tan(d * D2R);
const asinD = (x) => Math.asin(x) * R2D, acosD = (x) => Math.acos(Math.max(-1, Math.min(1, x))) * R2D;
function seedFrom(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function makeRng(str) {
  let a = seedFrom(str) % 4294967296;
  const next = () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)) };
}
const OPP = { a: "al", b: "be", c: "ga", al: "a", be: "b", ga: "c" };
const others = (k) => ["a", "b", "c"].filter((x) => x !== k);
function fromSides(a, b, c) { const al = acosD((b * b + c * c - a * a) / (2 * b * c)), be = acosD((a * a + c * c - b * b) / (2 * a * c)); return { a, b, c, al, be, ga: 180 - al - be }; }
function lalTri(unk, d) { const [x, y] = others(unk), s = { a: d.a, b: d.b, c: d.c }; s[unk] = Math.sqrt(d[x] ** 2 + d[y] ** 2 - 2 * d[x] * d[y] * cosD(d[OPP[unk]])); return fromSides(s.a, s.b, s.c); }
const far90 = (x) => Math.abs(x - 90) >= 4;

function genAll(seed) {
  const R = makeRng(seed), P = {};
  { const b = R.int(9, 24), c = R.int(10, 28), al = R.int(40, 80); P.g1 = { d: { b, c, al }, tri: lalTri("a", { b, c, al }), u: "m" }; }
  { let a, b, c, t; do { a = R.int(6, 15); b = R.int(7, 16); c = R.int(Math.max(a, b) + 2, a + b - 2); t = fromSides(a, b, c); } while (!far90(t.ga) || Math.min(t.al, t.be) < 20);
    P.g2 = { d: { a, b, c }, tri: t, u: "m" }; }
  { const b = R.int(10, 30), c = R.int(12, 35), al = R.int(40, 80); P.p1 = { d: { b, c, al }, tri: lalTri("a", { b, c, al }), u: "m" }; }
  { let a, b, c, t; do { b = R.int(12, 25); c = R.int(14, 28); a = R.int(Math.abs(b - c) + 4, b + c - 4); t = fromSides(a, b, c); } while (t.al < 35 || t.al > 120 || !far90(t.al) || Math.min(t.be, t.ga) < 15);
    P.p2 = { d: { a, b, c }, tri: t, u: "m" }; }
  { const a = R.int(12, 40), b = R.int(15, 45), ga = R.int(100, 140); P.p3 = { d: { a, b, ga }, tri: lalTri("c", { a, b, ga }), u: "km" }; }
  { let a, b, c, t; do { a = R.int(8, 20); c = R.int(9, 22); b = R.int(Math.max(a, c) + 2, a + c - 3); t = fromSides(a, b, c); } while (!far90(t.be) || Math.min(t.al, t.ga) < 15);
    P.p4 = { d: { a, b, c }, tri: t, u: "m" }; }
  { let al; const b = R.int(25, 40), c = R.int(20, 35); do { al = R.int(60, 150); } while (!far90(al)); P.p5 = { d: { b, c, al }, tri: lalTri("a", { b, c, al }), u: "cm" }; }
  { let a, b, c, t; do { a = R.int(10, 22); b = R.int(10, 22); c = R.int(Math.abs(a - b) + 4, a + b - 4); t = fromSides(a, b, c); } while (Math.min(t.al, t.be, t.ga) < 25 || ![t.al, t.be, t.ga].every(far90));
    P.p6 = { d: { a, b, c }, tri: t, u: "m" }; }
  return P;
}
if (typeof module !== "undefined") module.exports = { genAll, fromSides, lalTri };

/* ===== Calculadora científica (modo grados) ===== */
const Calc = (() => {
  let expr = "", ans = 0, lastRes = null, lastInput = null, openedAt = 0, lastPtr = "";
  /* Celular: pantalla táctil y angosta. Ahí NO se abre sola (evita el doble teclado: el del teléfono + la calculadora) */
  const isPhone = () => window.matchMedia("(pointer: coarse)").matches && Math.min(window.innerWidth, window.innerHeight) < 600;
  const tgtLabel = (inp) => { const l = inp && document.querySelector(`label[for="${inp.id}"]`); return l ? l.textContent.replace(/\s*=\s*$/, "") : ""; };
  function setTarget(inp) {
    lastInput = inp; const t = document.querySelector("#calc .hd .tgt"); if (!t) return;
    const name = inp && document.body.contains(inp) && !inp.readOnly ? tgtLabel(inp) : "";

      const t = document.elementFromPoint(ev.clientX, ev.clientY); const tgt = t && t.closest(targetSel);
      if (over && over !== tgt) over.classList.remove("hover");
      over = tgt; if (over) over.classList.add("hover");

    const up = () => {
      document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up);
      ghost.remove(); if (over) over.classList.remove("hover");
      if (moved) { if (over) onDrop(payload, over); }

        if (selected && selected.el === el) { selected = null; document.querySelectorAll(".sel-target").forEach((x) => x.classList.remove("sel-target")); }
        else { selected = { el, payload, onDrop }; el.classList.add("sel"); document.querySelectorAll(targetSel).forEach((x) => x.classList.add("sel-target")); }

    if ((M[0] - cen[0]) * n[0] + (M[1] - cen[1]) * n[1] < 0) n = [-n[0], -n[1]];

  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { E.tab = +b.dataset.t; save(); render(); });
  const set = (v) => { E.s[tab] = v; if (!E.done && fin(0) && fin(1)) { E.done = true; App.toast("¡Ejemplos completos! ⭐"); } save(); render(); };
  const q = (id) => document.getElementById(id);
  if (q("ejPrev")) q("ejPrev").onclick = () => set(i - 1);
  if (q("ejNext")) q("ejNext").onclick = () => set(i + 1);
  if (q("ejTab")) q("ejTab").onclick = () => { E.tab = 1; save(); render(); };
  if (q("ejGo")) q("ejGo").onclick = () => go(S.st + 1);
}

/* ---------------- Fórmulas para arrastrar ---------------- */
function fLAL(k) { const [x, y] = others(k); return [`${k}² = `, { s: [x, y], g: 1 }, "² + ", { s: [x, y], g: 1 }, "² − 2 · ", { s: [x, y], g: 2 }, " · ", { s: [x, y], g: 2 }, " · cos ", { s: [OPP[k]] }]; }
function fLLL(K, slotAng) { const k = OPP[K], [x, y] = others(k); return [...(slotAng ? ["cos ", { s: [K] }, " = ("] : [`cos ${SYM[K]} = (`]), { s: [x, y], g: 1 }, "² + ", { s: [x, y], g: 1 }, "² − ", { s: [k] }, "²) ÷ (2 · ", { s: [x, y], g: 2 }, " · ", { s: [x, y], g: 2 }, ")"]; }
function chipLabel(k, r) { return k in r.d ? `${SYM[k]} = ${r.d[k]}${isAng(k) ? "°" : " " + r.u}` : isAng(k) ? SYM[k] : `${SYM[k]} = ?`; }
function slotFill(k, r) { return k in r.d ? `${r.d[k]}${isAng(k) ? "°" : ""}` : SYM[k]; }
function formulaCard(num, title, F, st, r, chips, locked) {
  let si = 0;
  const html = F.map((p) => typeof p === "string" ? esc(p) : `<span class="slot" data-i="${si++}"></span>`).join("");
  return `<div class="card ${st.formula ? "ok" : ""} ${locked ? "locked" : ""}" id="sF"><h3><span class="num">${num}</span>${title}</h3>
    ${st.formula ? "" : `<p class="ex" style="margin-top:0">Arrastra (o toca y coloca) cada dato en su casilla. Doble clic en una casilla para vaciarla.</p><div class="chips">${chips.map((k) => `<span class="chip ${COL[k]}" data-k="${k}">${esc(chipLabel(k, r))}</span>`).join("")}</div>`}
    <div class="formula" id="formula">${html}</div>
    ${st.formula ? `<div class="fb ok">✔ Fórmula correcta</div>` : `<div class="row" style="margin-top:10px"><button class="btn" id="chkF">Revisar fórmula</button><button class="btn sec" id="clrF">Limpiar</button></div><div class="fb" id="fbF"></div>`}</div>`;
}
function bindFormula(F, st, r) {
  const slots = [...document.querySelectorAll("#formula .slot")], specs = F.filter((p) => typeof p !== "string");
  const fill = st.fill ? st.fill.slice() : new Array(slots.length).fill(null);
  const paint = () => slots.forEach((sl, i) => { sl.classList.toggle("filled", !!fill[i]); sl.innerHTML = fill[i] ? `<span class="${COL[fill[i]]}">${esc(slotFill(fill[i], r))}</span>` : ""; });
  if (st.formula) { paint(); slots.forEach((s) => s.classList.add("right")); return; }
  paint();
  const drop = (k, sl) => { fill[+sl.dataset.i] = k; sl.classList.remove("wrong", "right"); paint(); };
  document.querySelectorAll("#sF .chip").forEach((c) => makeDraggable(c, () => c.dataset.k, ".slot", drop));
  bindTapTargets("#formula .slot");
  slots.forEach((sl) => sl.addEventListener("dblclick", () => { fill[+sl.dataset.i] = null; sl.classList.remove("wrong", "right"); paint(); }));
  document.getElementById("clrF").onclick = () => { fill.fill(null); slots.forEach((s) => s.classList.remove("wrong", "right")); paint(); };
  document.getElementById("chkF").onclick = () => {
    const fb = document.getElementById("fbF");
    if (fill.some((x) => !x)) { fb.className = "fb bad"; fb.textContent = "Faltan casillas por llenar."; return; }
    let ok = true;
    specs.forEach((spc, i) => {
      let good = spc.s.includes(fill[i]);
      if (good && spc.g) { const grp = specs.map((x, j) => (x.g === spc.g ? fill[j] : null)).filter(Boolean); good = spc.s.every((k) => grp.includes(k)); }
      slots[i].classList.toggle("right", good); slots[i].classList.toggle("wrong", !good); ok = ok && good;
    });
    if (ok) { st.formula = true; st.fill = fill.slice(); save(); fb.className = "fb ok"; fb.textContent = "✔ ¡Fórmula correcta!"; setTimeout(render, 800); }
    else { fb.className = "fb bad"; fb.textContent = "Las casillas en rojo no van ahí. Pista: el lado opuesto al ángulo es el que va solo (mismo color que el ángulo)."; }
  };
}
const parseNum = (s) => parseFloat(String(s).replace(",", ".").replace(/[^\d.\-−]/g, "").replace("−", "-"));
function closeTo(v, target, dec) { return Math.abs(v - target) <= (dec === 4 ? 0.0006 : Math.max(0.06, Math.abs(target) * 0.003)); }
function ansGrid(list, st) {
  return `<div class="ans">${list.map((a) => `<label for="in_${a.k}">${a.label} =</label><input class="answer ${st.solved ? "right" : ""}" id="in_${a.k}" data-k="${a.k}" data-dec="${a.dec || 2}" inputmode="decimal" autocomplete="off" value="${st.vals[a.k] != null ? esc(st.vals[a.k]) : ""}" ${st.solved ? "readonly" : ""}><span>${a.u || ""}</span>`).join("")}</div>`;
}
function bindAnswers(list, st, onAll, onFail) {
  document.querySelectorAll("input.answer").forEach((inp) => inp.addEventListener("input", () => { st.vals[inp.dataset.k] = inp.value; inp.classList.remove("wrong", "right"); save(); }));
  return () => {
    let allOk = true, empty = false;
    list.forEach((a) => {
      const inp = document.getElementById("in_" + a.k), v = parseNum(inp.value);
      if (!isFinite(v)) { empty = true; allOk = false; inp.classList.add("wrong"); return; }
      const ok = closeTo(v, a.v, a.dec); inp.classList.toggle("right", ok); inp.classList.toggle("wrong", !ok); allOk = allOk && ok;
    });
    if (empty) return "empty";
    if (allOk) onAll(); else onFail();
    return allOk;
  };
}

/* ---------------- Réplica guiada ---------------- */
function guiaCfg(id) {
  const r = P[id], d = r.d;
  if (id === "g1") {
    const t = 2 * d.b * d.c * cosD(d.al), a2 = d.b ** 2 + d.c ** 2 - t;
    return { r, titulo: "Réplica 1 · Buscar un lado", ref: "Igual que el Ejemplo 1",
      enun: `Dos cuerdas parten del punto A: miden ${sp("b")} = ${d.b} m y ${sp("c")} = ${d.c} m, y forman un ángulo ${sp("al")} = ${d.al}°. ¿Qué distancia ${sp("a")} hay entre sus extremos?`,
      known: ["b", "c", "al"], unknown: ["a"],
      taps: [{ q: "Toca el lado que vas a calcular.", k: "a" }, { q: "Toca el ángulo que está entre los dos lados conocidos.", k: "al" }],
      tapDone: `Caso LAL: ${sp("a")} está frente a ${sp("al")}, que es el ángulo entre ${sp("b")} y ${sp("c")}.`,
      F: fLAL("a"), chips: ["b", "c", "al", "a"],
      rows: [{ k: "x2", label: "b²", v: d.b ** 2 }, { k: "y2", label: "c²", v: d.c ** 2 }, { k: "t", label: "2bc · cos α", v: t }, { k: "k2", label: "a²", v: a2 }, { k: "k", label: "a", v: Math.sqrt(a2), u: "m" }],
      tip: `Igual que en el Ejemplo 1: calcula cada parte y después resta. Al final, raíz cuadrada.` };
  }
  const num = d.a ** 2 + d.b ** 2 - d.c ** 2, den = 2 * d.a * d.b;
  return { r, titulo: "Réplica 2 · Buscar un ángulo", ref: "Igual que el Ejemplo 2",
    enun: `Un terreno triangular mide ${sp("a")} = ${d.a} m, ${sp("b")} = ${d.b} m y ${sp("c")} = ${d.c} m. ¿Cuánto mide su ángulo mayor?`,
    known: ["a", "b", "c"], unknown: [],
    taps: [{ q: "Toca el lado más largo.", k: "c" }, { q: "Toca el ángulo que está frente a ese lado.", k: "ga" }],
    tapDone: `Caso LLL: el ángulo mayor es ${sp("ga")}, frente al lado mayor ${sp("c")}.`,
    F: fLLL("ga"), chips: ["a", "b", "c"],
    rows: [{ k: "nu", label: "a² + b² − c²", v: num }, { k: "de", label: "2ab", v: den }, { k: "co", label: "cos γ", v: num / den, dec: 4 }, { k: "an", label: "γ", v: acosD(num / den), u: "°" }],
    tip: `Igual que en el Ejemplo 2: numerador, denominador, divide (4 decimales) y usa cos⁻¹.` };
}

/* ---------------- Retos de práctica ---------------- */
function retoCfg(id) {
  const r = P[id], d = r.d, t = r.tri;
  const LAL = (k, title, story) => ({ r, t: title, ley: "Buscar un lado (LAL)", law: "LAL", story, known: Object.keys(d), unknown: [k], F: fLAL(k), chips: [...others(k), OPP[k], k],
    ans: [{ k, label: SYM[k], v: t[k], u: r.u }], lawWhy: `Dos lados y el ángulo entre ellos. El lado que buscas, ${sp(k)}, está frente a ${sp(OPP[k])}.`,
    h1: `${SYM[k]}² = ${others(k).join("² + ")}² − 2${others(k).join("")} · cos ${SYM[OPP[k]]}. Al final saca raíz.`,
    h2: (() => { const [x, y] = others(k); return `${SYM[k]}² = ${d[x]}² + ${d[y]}² − 2(${d[x]})(${d[y]}) · cos ${d[OPP[k]]}° ≈ ${f2(t[k] ** 2)}`; })() });
  switch (id) {
    case "p1": return LAL("a", "El largo del lago", `Para medir un lago, desde el punto A se mide la distancia a cada extremo: ${sp("b")} = ${d.b} m y ${sp("c")} = ${d.c} m. El ángulo entre esas visuales es ${sp("al")} = ${d.al}°. ¿Cuánto mide el lago (${sp("a")})?`);
    case "p3": return LAL("c", "Dos barcos", `Dos barcos salen del mismo puerto C. Después de un tiempo, uno está a ${sp("a")} = ${d.a} km y el otro a ${sp("b")} = ${d.b} km del puerto. Sus rutas forman un ángulo ${sp("ga")} = ${d.ga}°. ¿Qué distancia ${sp("c")} los separa?`);
    case "p5": return LAL("a", "El brazo robótico", `Un brazo robótico tiene un segmento de ${sp("b")} = ${d.b} cm y otro de ${sp("c")} = ${d.c} cm. El codo forma un ángulo ${sp("al")} = ${d.al}°. ¿Qué distancia ${sp("a")} hay del hombro a la pinza?`);
    case "p2": return { r, t: "La esquina del terreno", ley: "Buscar un ángulo (LLL)", law: "LLL", known: ["a", "b", "c"], unknown: ["al"], F: fLLL("al"), chips: ["a", "b", "c"],
      story: `Un terreno mide ${sp("a")} = ${d.a} m, ${sp("b")} = ${d.b} m y ${sp("c")} = ${d.c} m. ¿Cuánto mide el ángulo ${sp("al")}, que está frente al lado ${sp("a")}?`,
      ans: [{ k: "al", label: "α", v: t.al, u: "°" }], lawWhy: "Tres lados, ningún ángulo: LLL. El lado que va restando arriba es a, el opuesto a α.",
      h1: "cos α = (b² + c² − a²) ÷ (2bc). Después usa cos⁻¹.", h2: `cos α = (${d.b}² + ${d.c}² − ${d.a}²) ÷ (2·${d.b}·${d.c}) ≈ ${f4(cosD(t.al))}` };
    case "p4": return { r, t: "El ángulo mayor", ley: "Buscar un ángulo (LLL)", law: "LLL", known: ["a", "b", "c"], unknown: [], F: fLLL("be", true), chips: ["a", "b", "c", "al", "be", "ga"],
      story: `Una rampa triangular mide ${sp("a")} = ${d.a} m, ${sp("b")} = ${d.b} m y ${sp("c")} = ${d.c} m. ¿Cuánto mide su ángulo <b>mayor</b>? Primero decide cuál es.`,
      ans: [{ k: "be", label: "ángulo mayor", v: t.be, u: "°" }], lawWhy: "Tres lados: LLL. El ángulo mayor está frente al lado mayor.",
      h1: `El lado mayor es b = ${d.b} m, así que el ángulo mayor es β: cos β = (a² + c² − b²) ÷ (2ac).`, h2: `cos β = (${d.a}² + ${d.c}² − ${d.b}²) ÷ (2·${d.a}·${d.c}) ≈ ${f4(cosD(t.be))}` };
    case "p6": return { r, t: "La armadura completa", ley: "Los tres ángulos (LLL)", law: "LLL", known: ["a", "b", "c"], unknown: ["al", "be", "ga"], F: fLLL("al"), chips: ["a", "b", "c"],
      story: `Una armadura triangular tiene lados ${sp("a")} = ${d.a} m, ${sp("b")} = ${d.b} m y ${sp("c")} = ${d.c} m. Encuentra los tres ángulos. (La fórmula de abajo es para α; β se obtiene igual y γ con la suma de 180°.)`,
      ans: [{ k: "al", label: "α", v: t.al, u: "°" }, { k: "be", label: "β", v: t.be, u: "°" }, { k: "ga", label: "γ", v: t.ga, u: "°" }],
      lawWhy: "Tres lados: LLL. Usa la ley de cosenos dos veces y la suma de ángulos para el tercero.",
      h1: "α con cos α = (b² + c² − a²) ÷ (2bc); β con cos β = (a² + c² − b²) ÷ (2ac); γ = 180° − α − β.",
      h2: `cos α ≈ ${f4(cosD(t.al))} · cos β ≈ ${f4(cosD(t.be))}` };
  }
}

/* ---------------- Comprobante y verificación ---------------- */
function resumen() {
  const sup = PIDS.filter((i) => S.x[i] && S.x[i].solved && !S.x[i].revealed).length;
  const pistas = PIDS.reduce((a, i) => a + (S.x[i] ? S.x[i].hints : 0), 0);
  const sol = PIDS.filter((i) => S.x[i] && S.x[i].revealed).length;
  const gu = ["g1", "g2"].filter((i) => S.x[i] && S.x[i].solved).length;
  return { sup, txt: `${sup}/6 · guiadas ${gu}/2 · pistas ${pistas} · soluciones ${sol}` };
}
function fechaStr(d) { const p = (x) => String(x).padStart(2, "0"); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function renderFin() {
  const R = resumen();
  const estado = (i) => { const x = S.x[i]; if (!x || !x.solved) return ["✖ Pendiente", ""]; if (x.revealed) return ["◐ Con solución", "help"]; if (x.hints) return [`✔ Superado (${x.hints} pista${x.hints > 1 ? "s" : ""})`, "help"]; return ["✔ Superado", "done"]; };
  let certHTML = "";
  if (S.cert) {
    const payload = `${norm(S.nombre)}|${norm(S.grupo)}|${S.cert.fecha}|${S.cert.res}`;
    const fila = (lbl, ok) => `<tr><td>${lbl}</td><td>${ok ? "✔ Completado" : "✖ Pendiente"}</td><td>—</td></tr>`;
    certHTML = `<div id="cert">
      <div class="kicker" style="color:#E76F51">UNIVERSIDAD XOCHICALCO · PREPARATORIA · MATEMÁTICAS V</div>
      <h3>Comprobante de retos superados</h3>
      <p style="margin:4px 0 10px;color:#34495E">Guía de autoestudio: Ley de Cosenos</p>
      <p style="margin:0"><b>Nombre:</b> ${esc(S.nombre)}<br><b>Grupo:</b> ${esc(S.grupo)}<br><b>Fecha:</b> ${S.cert.fecha}<br><b>Variante:</b> ${codeFor(norm(S.nombre) + "|" + norm(S.grupo)).slice(0, 4)}</p>
      <div class="badges">${["g1", "g2", ...PIDS].map((i) => `<div class="badge ${estado(i)[1]}">${STATIONS.find((s) => s.id === i).n}</div>`).join("")}</div>
      <table><tr><th>Estación</th><th>Estado</th><th>Intentos</th></tr>
        ${fila("Exploración del triángulo", S.exp.done)}${fila("Ejemplos resueltos", S.ej.done)}
        ${["g1", "g2", ...PIDS].map((i) => `<tr><td>${STATIONS.find((s) => s.id === i).t}${PIDS.includes(i) ? " · " + retoCfg(i).t : ""}</td><td>${estado(i)[0]}</td><td>${S.x[i] ? S.x[i].attempts : 0}</td></tr>`).join("")}
      </table>
      <p style="margin:6px 0"><b>Resultado:</b> ${S.cert.res}</p>
      <p style="margin:6px 0"><b>Código de verificación:</b> <span class="code">${codeFor(payload)}</span></p>
      <p class="ex">El docente puede comprobar este código. Si cambia cualquier dato del comprobante, el código deja de coincidir.</p>
    </div>
    <div class="row noprint" style="margin-top:14px"><button class="btn" onclick="window.print()">🖨️ Imprimir o guardar PDF</button><button class="btn sec" id="regen">Actualizar comprobante</button></div>`;
  }
  main().innerHTML = `
  <h2 class="st noprint">Tu comprobante</h2>
  <p class="lead noprint">Llevas <b>${R.sup} de 6</b> retos superados sin ver la solución. ${R.sup < 6 ? "Puedes volver a los pendientes y luego actualizar tu comprobante." : "¡Excelente trabajo! 🎉"}</p>
  ${S.cert ? certHTML : `<div class="card noprint"><p style="margin-top:0">Cuando estés listo, genera tu comprobante. Se registra la fecha y hora en que lo generes.</p><button class="btn gr" id="gen">Generar comprobante</button></div>`}`;
  const g = document.getElementById("gen") || document.getElementById("regen");
  if (g) g.onclick = () => { S.cert = { fecha: fechaStr(new Date()), res: resumen().txt }; save(); render(); };
}
function renderVerificar() {
  document.querySelector("footer.bottom").style.display = "none"; document.getElementById("nav").style.display = "none";
  main().innerHTML = `<h2 class="st">Verificar comprobante · Ley de Cosenos</h2>
  <p class="lead">Copia los datos tal como aparecen en el comprobante del estudiante.</p>
  <div class="card form">
    <label for="vn">Nombre</label><input id="vn"><label for="vg">Grupo</label><input id="vg">
    <label for="vf">Fecha (dd/mm/aaaa hh:mm)</label><input id="vf" placeholder="18/11/2026 10:35">
    <label for="vr">Resultado</label><input id="vr" placeholder="6/6 · guiadas 2/2 · pistas 1 · soluciones 0">
    <label for="vc">Código</label><input id="vc">
    <div class="row" style="margin-top:14px"><button class="btn gr" id="vbtn">Verificar</button></div><div class="fb" id="vfb"></div></div>`;
  document.getElementById("vbtn").onclick = () => {
    const v = (id) => document.getElementById(id).value.trim();
    const ok = codeFor(`${norm(v("vn"))}|${norm(v("vg"))}|${v("vf")}|${v("vr").replace(/\s*·\s*/g, " · ")}`) === v("vc").toUpperCase();
    const fb = document.getElementById("vfb"); fb.className = "fb " + (ok ? "ok" : "bad");
    fb.textContent = ok ? "✔ El código coincide con los datos." : "✖ No coincide. Revisa que los datos estén copiados exactamente.";
  };
}

/* ---------------- Inicio ---------------- */
function init() {
  Calc.init();
  document.getElementById("calcBtn").onclick = () => Calc.toggle();
  if (location.hash === "#verificar") { renderVerificar(); return; }
  S = load() || fresh();
  if (S.nombre) P = genAll(norm(S.nombre) + "|" + norm(S.grupo));
  document.getElementById("prev").onclick = () => go(S.st - 1);
  document.getElementById("next").onclick = () => go(S.st + 1);
  render();
}
if (typeof document !== "undefined") document.addEventListener("DOMContentLoaded", init);
</script>
</body>
